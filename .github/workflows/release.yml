name: Release

on:
  push:
    tags: ["v*"]
  # Build all three platforms without cutting a release, so a broken
  # toolchain is found before a tag depends on it -- the 1.2.1 Linux build
  # failed at release time, with the tag already pushed.
  workflow_dispatch:

jobs:
  build-linux-static:
    name: Linux (static, x86-64)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: alpine:3.23
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          apk add --no-cache \
            ghc cabal \
            musl-dev zlib-dev zlib-static \
            gmp-dev gmp-static \
            libffi-dev \
            ncurses-dev ncurses-static \
            git

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          # Alpine's cabal follows the XDG layout, so the store is here and
          # not in ~/.cabal -- which this used to cache, always missing.
          path: |
            ~/.cache/cabal
            ~/.local/state/cabal
          key: linux-static-cabal-${{ hashFiles('minaosou.cabal') }}
          restore-keys: linux-static-cabal-

      - name: Update Cabal index
        run: cabal update

      - name: Build static binary
        run: |
          cabal build \
            --enable-executable-static \
            --ghc-options="-optl-static -optl-pthread"

      - name: Copy and strip binary
        run: |
          cp $(cabal list-bin minaosou) minaosou-linux-x86_64
          strip minaosou-linux-x86_64

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: minaosou-linux-x86_64

  build-macos-arm64:
    name: macOS (arm64)
    # Pinned, not macos-latest: the macos-26 image of 2026-10-13 ships a
    # MacOSX27.0 SDK in its Command Line Tools whose .tbd stubs the linker
    # rejects ("tapi error: malformed file ... unknown architecture"), so
    # every dependency failed to link and 1.2.4 went out without a macOS
    # binary. Move back to macos-latest once a workflow_dispatch run there
    # links again.
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up GHC
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8'
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          path: ~/.cabal
          key: macos-arm64-cabal-${{ hashFiles('minaosou.cabal') }}
          restore-keys: macos-arm64-cabal-

      - name: Update Cabal index
        run: cabal update

      - name: Build binary
        run: cabal build

      - name: Copy and strip binary
        run: |
          cp $(cabal list-bin minaosou) minaosou-macos-arm64
          strip minaosou-macos-arm64

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: minaosou-macos-arm64

      # A manual run publishes nothing, but keep its binary: it is how a
      # release whose macOS job failed gets its binary after the fact
      # (gh run download, then gh release upload).
      - name: Keep binary from a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: minaosou-macos-arm64
          path: minaosou-macos-arm64

  build-windows-x86_64:
    name: Windows (x86-64)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up GHC
        id: setup
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.8'
          cabal-version: 'latest'

      - name: Cache Cabal store
        uses: actions/cache@v5
        with:
          # ~/.cabal is Unix-only; use the store path the setup action reports.
          path: ${{ steps.setup.outputs.cabal-store }}
          key: windows-x86_64-cabal-${{ hashFiles('minaosou.cabal') }}
          restore-keys: windows-x86_64-cabal-

      - name: Update Cabal index
        run: cabal update

      - name: Build binary
        run: cabal build

      - name: Copy binary
        # bash (Git Bash) is available on windows-latest; needed for $(...) + cp.
        shell: bash
        run: cp "$(cabal list-bin minaosou)" minaosou-windows-x86_64.exe

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: minaosou-windows-x86_64.exe
